# render.yaml — Render deployment configuration for BongPizza POS
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend (Express API on VPS) ──────────────────────────────
  # NOTE: Backend runs on your VPS, not Render.
  # Deploy manually on your VPS — see README for VPS setup steps.

  # ── Frontend (Render Static Site) ─────────────────────────────
  - type: web
    name: bongpizza-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Set this to your VPS IP/domain in Render dashboard
        # Example: http://65.123.45.67:7070/api
        value: http://YOUR_VPS_IP:7070/api
